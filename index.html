<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TRIO HDG Games</title>
<style>
  :root { --bg: #f6f7f9; --card: #ffffff; --text: #1d2330; --muted: #5d6675; --accent: #d6345a; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #12151b; --card: #1c2029; --text: #eef0f4; --muted: #9aa3b2; --accent: #ff5c7f; }
  }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 48px 16px; }
  h1 { margin: 0 0 4px; font-size: 28px; }
  .sub { color: var(--muted); margin: 0 0 32px; }
  .card { background: var(--card); border-radius: 12px; padding: 20px; margin-bottom: 16px; }
  .card h2 { margin: 0 0 8px; font-size: 20px; }
  .card p { margin: 0 0 12px; color: var(--muted); }
  a { color: var(--accent); }
  .links a { margin-right: 16px; }
  footer { color: var(--muted); font-size: 14px; margin-top: 32px; }
</style>
</head>
<body>
<main>
  <h1>TRIO HDG Games</h1>
  <p class="sub">Indie mobile games</p>

  <div class="card">
    <h2>Spinshot</h2>
    <p>Tap to shoot, ride the recoil! A one-tap physics gun duel.</p>
    <div class="links">
      <a href="https://play.google.com/store/apps/details?id=com.triohdg.spinshot">Google Play</a>
      <a href="https://sites.google.com/view/spinshot-privacy/ana-sayfa">Privacy policy</a>
    </div>
  </div>

  <footer>Contact: <a href="mailto:support.triohdggames@gmail.com">support.triohdggames@gmail.com</a></footer>
</main>
</body>
</html>
